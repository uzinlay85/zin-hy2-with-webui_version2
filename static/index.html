<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hysteria 2 Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        card: '#1e293b',
                        primary: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen antialiased text-gray-200">

    <!-- Login Modal -->
    <div id="loginOverlay" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#0f172a]">
        <div class="glass w-full max-w-sm rounded-2xl p-8 shadow-2xl text-center">
            <h2 class="text-3xl font-bold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">Admin Login</h2>
            <p class="text-sm text-gray-400 mb-8">Enter your credentials to manage Hysteria 2</p>
            <form id="loginForm" onsubmit="doLogin(event)">
                <div class="space-y-4 text-left">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Username</label>
                        <input type="text" id="loginUsername" required class="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Password</label>
                        <input type="password" id="loginPassword" required class="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary">
                    </div>
                </div>
                <button type="submit" id="loginBtn" class="mt-8 w-full bg-primary hover:bg-blue-600 text-white px-5 py-3 rounded-lg font-medium transition shadow-lg shadow-blue-500/30">
                    Sign In
                </button>
                <p id="loginError" class="mt-4 text-red-400 text-sm hidden">Invalid username or password</p>
            </form>
        </div>
    </div>

    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                Hysteria 2 Web Panel
            </h1>
            <div class="flex gap-4">
                <button onclick="doLogout()" class="bg-red-700 hover:bg-red-600 text-white px-5 py-2 rounded-lg font-medium transition shadow-lg">
                    Logout
                </button>
                <button onclick="openAdminModal()" class="bg-gray-700 hover:bg-gray-600 text-white px-5 py-2 rounded-lg font-medium transition shadow-lg">
                    Admin Settings
                </button>
                <button onclick="openModal()" class="bg-primary hover:bg-blue-600 text-white px-5 py-2 rounded-lg font-medium transition shadow-lg shadow-blue-500/30">
                    + Add User
                </button>
            </div>
        </header>

        <div class="glass rounded-2xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="uppercase tracking-wider border-b border-gray-700 bg-gray-800/50 text-gray-400 text-xs">
                        <tr>
                            <th class="px-6 py-4 font-medium">Username</th>
                            <th class="px-6 py-4 font-medium">Password</th>
                            <th class="px-6 py-4 font-medium">Data Limit</th>
                            <th class="px-6 py-4 font-medium">Used Data</th>
                            <th class="px-6 py-4 font-medium">Expire Date</th>
                            <th class="px-6 py-4 font-medium">Devices</th>
                            <th class="px-6 py-4 font-medium">Status</th>
                            <th class="px-6 py-4 font-medium text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="divide-y divide-gray-700/50">
                        <!-- Rows will be populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- User Modal -->
    <div id="userModal" class="modal fixed inset-0 z-50 items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="glass w-full max-w-md rounded-2xl p-6 shadow-2xl transform transition-all">
            <h2 id="modalTitle" class="text-2xl font-bold mb-6">Add New User</h2>
            <form id="userForm" onsubmit="saveUser(event)">
                <input type="hidden" id="userId">
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Username (Client ID)</label>
                        <input type="text" id="username" required class="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary">
                    </div>
                    
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Password</label>
                        <input type="text" id="password" required class="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary">
                    </div>
                    
                    <div class="flex gap-4">
                        <div class="w-1/2">
                            <label class="block text-sm text-gray-400 mb-1">Data Limit (GB)</label>
                            <input type="number" step="0.1" id="dataLimit" placeholder="0 = Unlimited" class="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary">
                        </div>
                        <div class="w-1/2">
                            <label class="block text-sm text-gray-400 mb-1">Max Devices</label>
                            <input type="number" id="deviceLimit" placeholder="0 = Unlimited" class="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Expire Date</label>
                        <input type="date" id="expireDate" class="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary" style="color-scheme: dark;">
                    </div>
                    
                    <div class="flex items-center mt-4">
                        <input type="checkbox" id="isActive" checked class="w-4 h-4 text-primary bg-gray-800 border-gray-600 rounded focus:ring-primary focus:ring-2">
                        <label class="ml-2 text-sm text-gray-400">Account Active</label>
                    </div>
                </div>
                
                <div class="mt-8 flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 transition">Cancel</button>
                    <button type="submit" class="bg-primary hover:bg-blue-600 text-white px-5 py-2 rounded-lg font-medium transition shadow-lg shadow-blue-500/30">Save User</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Admin Settings Modal -->
    <div id="adminModal" class="modal fixed inset-0 z-50 items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="glass w-full max-w-sm rounded-2xl p-6 shadow-2xl transform transition-all">
            <h2 class="text-2xl font-bold mb-6">Admin Settings</h2>
            <form id="adminForm" onsubmit="updateAdmin(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">New Username</label>
                        <input type="text" id="newAdminUser" required class="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">New Password</label>
                        <input type="password" id="newAdminPass" required class="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-primary">
                    </div>
                </div>
                
                <div class="mt-8 flex justify-end gap-3">
                    <button type="button" onclick="closeAdminModal()" class="px-4 py-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-800 transition">Cancel</button>
                    <button type="submit" class="bg-primary hover:bg-blue-600 text-white px-5 py-2 rounded-lg font-medium transition shadow-lg shadow-blue-500/30">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'api/users'; // relative path to work behind reverse proxy
        let usersList = [];

        function formatBytes(bytes, decimals = 2) {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }

        let authHeader = sessionStorage.getItem('hy2_auth');
        
        document.addEventListener("DOMContentLoaded", () => {
            if(authHeader) {
                document.getElementById('loginOverlay').style.display = 'none';
                fetchUsers();
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
            }
        });

        async function doLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value;
            const p = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('loginError');
            
            btn.innerText = "Signing In...";
            btn.disabled = true;
            err.classList.add('hidden');
            
            const token = 'Basic ' + btoa(u + ':' + p);
            
            try {
                const res = await fetch('api/login', {
                    method: 'POST',
                    headers: { 'Authorization': token }
                });
                
                if(res.ok) {
                    sessionStorage.setItem('hy2_auth', token);
                    authHeader = token;
                    document.getElementById('loginOverlay').style.display = 'none';
                    fetchUsers();
                } else {
                    err.classList.remove('hidden');
                }
            } catch(e) {
                err.innerText = "Connection failed";
                err.classList.remove('hidden');
            }
            btn.innerText = "Sign In";
            btn.disabled = false;
        }

        function doLogout() {
            sessionStorage.removeItem('hy2_auth');
            authHeader = null;
            document.getElementById('loginOverlay').style.display = 'flex';
        }

        async function apiFetch(url, options = {}) {
            if(!options.headers) options.headers = {};
            if(authHeader) options.headers['Authorization'] = authHeader;
            const res = await fetch(url, options);
            if(res.status === 401) {
                sessionStorage.removeItem('hy2_auth');
                authHeader = null;
                document.getElementById('loginOverlay').style.display = 'flex';
                throw new Error("Unauthorized");
            }
            return res;
        }

        async function fetchUsers() {
            if(!authHeader) return;
            try {
                const res = await apiFetch(API_URL);
                const data = await res.json();
                usersList = data.users;
                renderUsers();
            } catch (err) {
                console.error("Failed to fetch users", err);
            }
        }

        function renderUsers() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';
            
            usersList.forEach(u => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-800/30 transition';
                
                const dataUsed = formatBytes(u.data_used_bytes);
                const dataLimit = u.data_limit_gb > 0 ? `${u.data_limit_gb} GB` : 'Unlimited';
                
                let progressPercent = 0;
                if (u.data_limit_gb > 0) {
                    progressPercent = (u.data_used_bytes / (u.data_limit_gb * 1024 * 1024 * 1024)) * 100;
                    if(progressPercent > 100) progressPercent = 100;
                }

                let statusBadge = u.is_active 
                    ? `<span class="px-2 py-1 rounded-full bg-emerald-500/20 text-emerald-400 text-xs">Active</span>`
                    : `<span class="px-2 py-1 rounded-full bg-red-500/20 text-red-400 text-xs">Disabled</span>`;

                // If expired by date
                if (u.expire_date && new Date() > new Date(u.expire_date)) {
                    statusBadge = `<span class="px-2 py-1 rounded-full bg-orange-500/20 text-orange-400 text-xs">Expired</span>`;
                }
                
                // If data limit reached
                if (u.data_limit_gb > 0 && progressPercent >= 100) {
                    statusBadge = `<span class="px-2 py-1 rounded-full bg-red-500/20 text-red-400 text-xs">Data Limit</span>`;
                }

                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium">${u.username}</td>
                    <td class="px-6 py-4 text-gray-400">${u.password}</td>
                    <td class="px-6 py-4">${dataLimit}</td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-2">
                            <span>${dataUsed}</span>
                            ${u.data_limit_gb > 0 ? `
                            <div class="w-16 h-1.5 bg-gray-700 rounded-full overflow-hidden">
                                <div class="h-full ${progressPercent > 90 ? 'bg-red-500' : 'bg-primary'}" style="width: ${progressPercent}%"></div>
                            </div>
                            ` : ''}
                        </div>
                    </td>
                    <td class="px-6 py-4 text-gray-400">${u.expire_date ? u.expire_date.split('T')[0] : 'Never'}</td>
                    <td class="px-6 py-4">${u.device_limit > 0 ? u.device_limit : 'Unlimited'}</td>
                    <td class="px-6 py-4">${statusBadge}</td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="copyLink(${u.id})" class="text-purple-400 hover:text-purple-300 mr-3 text-sm transition" title="Copy Hysteria2 Link">
                            Copy Link
                        </button>
                        <button onclick="resetData(${u.id})" class="text-emerald-400 hover:text-emerald-300 mr-3 text-sm transition" title="Reset Used Data">
                            Reset Data
                        </button>
                        <button onclick="editUser(${u.id})" class="text-blue-400 hover:text-blue-300 mr-3 text-sm transition">
                            Edit
                        </button>
                        <button onclick="deleteUser(${u.id})" class="text-red-400 hover:text-red-300 text-sm transition">
                            Delete
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openModal() {
            document.getElementById('modalTitle').innerText = 'Add New User';
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            // Auto generate password
            document.getElementById('password').value = Math.random().toString(36).slice(-6);
            // Set defaults: unlimited data, unlimited days, 1 device
            document.getElementById('dataLimit').value = '0';
            document.getElementById('deviceLimit').value = '1';
            document.getElementById('expireDate').value = '';
            
            document.getElementById('userModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('userModal').classList.remove('active');
        }

        function openAdminModal() {
            document.getElementById('adminForm').reset();
            document.getElementById('adminModal').classList.add('active');
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.remove('active');
        }

        async function updateAdmin(e) {
            e.preventDefault();
            const u = document.getElementById('newAdminUser').value;
            const p = document.getElementById('newAdminPass').value;
            
            try {
                const res = await apiFetch('api/admin', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({new_username: u, new_password: p})
                });
                if(res.ok) {
                    alert("Admin credentials updated. Please login again.");
                    sessionStorage.removeItem('hy2_auth');
                    window.location.reload();
                } else {
                    const err = await res.json();
                    alert("Error: " + (err.detail || "Failed to update"));
                }
            } catch(err) {
                console.error(err);
            }
        }

        function editUser(id) {
            const u = usersList.find(x => x.id === id);
            if(!u) return;
            
            document.getElementById('modalTitle').innerText = 'Edit User';
            document.getElementById('userId').value = u.id;
            document.getElementById('username').value = u.username;
            document.getElementById('password').value = u.password;
            document.getElementById('dataLimit').value = u.data_limit_gb;
            document.getElementById('deviceLimit').value = u.device_limit;
            document.getElementById('isActive').checked = u.is_active;
            
            if(u.expire_date) {
                document.getElementById('expireDate').value = u.expire_date.split('T')[0];
            } else {
                document.getElementById('expireDate').value = '';
            }
            
            document.getElementById('userModal').classList.add('active');
        }

        function copyLink(id) {
            const u = usersList.find(x => x.id === id);
            if(!u) return;
            const domain = window.location.hostname;

            // ✅ Universal link - app အားလုံးအတွက် (Clash Meta, Sing-box, ShadowRocket, NekoBox, V2rayN)
            const link = `hysteria2://${u.password}@${domain}:443?security=tls&fm=%7B%22quicParams%22%3A%7B%22udpHop%22%3A%7B%22ports%22%3A%2220000-50000%22%7D%7D%7D&mport=20000-50000&sni=${domain}#${u.username}`;

            navigator.clipboard.writeText(link).then(() => {
                alert("✅ Link copied!");
            }).catch(err => {
                prompt("Copy this link:", link);
            });
        }

        async function saveUser(e) {
            e.preventDefault();
            const id = document.getElementById('userId').value;
            
            let exp = document.getElementById('expireDate').value;
            if(exp) exp = exp + 'T23:59:59Z'; // Set to end of day
            
            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                data_limit_gb: parseFloat(document.getElementById('dataLimit').value) || 0,
                device_limit: parseInt(document.getElementById('deviceLimit').value) || 0,
                expire_date: exp,
                is_active: document.getElementById('isActive').checked
            };
            
            try {
                const method = id ? 'PUT' : 'POST';
                const url = id ? `${API_URL}/${id}` : API_URL;
                
                const res = await apiFetch(url, {
                    method,
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                if(res.ok) {
                    closeModal();
                    fetchUsers();
                } else {
                    const err = await res.json();
                    alert("Error: " + (err.detail || "Failed to save"));
                }
            } catch(err) {
                console.error(err);
                alert("Request failed");
            }
        }

        async function deleteUser(id) {
            if(!confirm("Are you sure you want to delete this user?")) return;
            try {
                await apiFetch(`${API_URL}/${id}`, { method: 'DELETE' });
                fetchUsers();
            } catch(err) {
                console.error(err);
            }
        }

        async function resetData(id) {
            if(!confirm("Are you sure you want to reset the used data to 0?")) return;
            try {
                await apiFetch(`${API_URL}/${id}/reset_data`, { method: 'POST' });
                fetchUsers();
            } catch(err) {
                console.error(err);
            }
        }

        // Initialize
        // fetchUsers(); is called after login or page load
        // Poll every 10 seconds for live updates
        setInterval(fetchUsers, 10000);
    </script>
</body>
</html>
